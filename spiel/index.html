<!--
  DIE BUEHNE. Fuellt den Viewport exakt (100vw/100vh, kein Letterbox-Balken,
  kein Scrollbalken). Bezugsformat 2752x1536 — alle Koordinaten in Prozent,
  damit eine Aufnahme in 2752x1536 randlos ist.

  Ebenenstapel mit fester z-Ordnung. Jede Ebene ist ein leerer Container;
  ein Stueck holt sich seinen eigenen Unterbehaelter mit BRAUHAUS.ebene(name)
  und schreibt NIE ausserhalb davon.
-->
<div id="buehne" data-epoche="1">
  <div class="ebene" id="ebene-platte" data-ebene="platte"></div><!-- Epochenbild      -->
  <div class="ebene" id="ebene-bau"    data-ebene="bau"></div><!-- gebaute Gebaeude    -->
  <div class="ebene" id="ebene-marken" data-ebene="marken"></div><!-- Schilder, Gegner -->
  <div class="ebene" id="ebene-hand"   data-ebene="hand"></div><!-- Faesser, Wagen     -->
  <div class="ebene" id="ebene-kopf"   data-ebene="kopf"></div><!-- HUD, WEITER        -->
  <div class="ebene" id="ebene-blatt"  data-ebene="blatt"></div><!-- Blaetter, Panels  -->
</div>
