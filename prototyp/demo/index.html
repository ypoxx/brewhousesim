<title>Brauhaus zum Anker — Die Fuhre</title>
<style>
  :root {
    --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    --serif: Georgia, "Times New Roman", "Liberation Serif", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --papier: #eeeae1;
    --tinte: #1b1a18;
    --rot: #c0442a;
    --hell: #cdc5b6;
    --matt: #857d6e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #100f0d; color: var(--hell);
    font-family: var(--sans); overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #buehne {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1600px; height: 900px;
    box-shadow: 0 30px 90px #000c;
    background: var(--papier);
  }
  svg { display: block; width: 100%; height: 100%; touch-action: none; }
  svg text { font-family: var(--sans); }
  /* nur wo kein eigenes fill gesetzt ist — sonst gewinnt CSS gegen das Attribut */
  svg text:not([fill]) { fill: var(--tinte); }
  .h   { font-size: 15px; font-weight: 700; letter-spacing: .1em; }
  .hs  { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
  .l   { font-size: 17px; }
  .lb  { font-size: 18px; font-weight: 700; }
  .s   { font-size: 14px; fill: #5f5b54; }
  .n   { font-size: 18px; font-variant-numeric: tabular-nums; }
  .nb  { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rot { fill: var(--rot); }
  .kreide { font-family: var(--serif); font-style: italic; fill: #efe9dc; }
  .hand   { font-family: var(--serif); font-style: italic; font-size: 19px; }
  .titel  { font-size: 58px; font-weight: 700; letter-spacing: .01em; }

  .greifbar { cursor: grab; }
  .greifbar:active { cursor: grabbing; }
  .ziel { cursor: pointer; }
  .knopf { cursor: pointer; }
  .knopf .feld { fill: var(--tinte); transition: fill .15s; }
  .knopf:hover .feld { fill: var(--rot); }
  .knopf.aus { cursor: default; opacity: .3; }
  .knopf.aus:hover .feld { fill: var(--tinte); }
  [tabindex]:focus { outline: none; }
  [tabindex]:focus-visible .fokus { stroke: var(--rot); stroke-width: 2.5; stroke-dasharray: 4 3; }

  /* Vorhang für Szenenwechsel */
  #vorhang {
    position: absolute; inset: 0; background: #100f0d; pointer-events: none;
    opacity: 0; transition: opacity .45s ease;
  }
  #vorhang.zu { opacity: 1; }

  /* Nachricht oben */
  #hinweis {
    position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%);
    background: #16150fEE; color: #efe9dc; padding: 10px 22px;
    font-size: 15px; letter-spacing: .04em; border: 1px solid #4a4438;
    opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
    z-index: 5; border-radius: 2px;
  }
  #hinweis.an { opacity: 1; }

  #ton {
    position: absolute; right: 14px; bottom: 12px; z-index: 6;
    background: none; border: 1px solid #4a4438; color: var(--matt);
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    padding: 5px 10px; cursor: pointer; border-radius: 2px;
  }
  #ton:hover { color: var(--hell); border-color: var(--matt); }
  #klein {
    position: absolute; inset: 0; display: none; place-items: center;
    background: #100f0d; color: var(--matt); font-size: 15px;
    text-align: center; padding: 30px; line-height: 1.6; z-index: 20;
  }
  @media (max-width: 1000px), (max-height: 620px) {
    #klein { display: grid; }
  }
</style>

<div id="wrap">
  <div id="buehne"><svg id="svg" viewBox="0 0 1600 900" role="application"
       aria-label="Brauhaus zum Anker, die Fuhre"></svg></div>
  <div id="vorhang"></div>
  <div id="hinweis"></div>
  <button id="ton" aria-label="Ton an oder aus">TON: AUS</button>
  <div id="klein">Diese Demo braucht ein Fenster von mindestens 1000 × 620 Punkten.<br>
    Bitte am größeren Bildschirm öffnen.</div>
</div>

  /* ==================================================================
     0 — TON: alles synthetisiert, keine Datei, kein Netz
     ================================================================== */
  const Ton = (function () {
    let ctx = null, an = false, bett = null, meister = null;

    function start() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      meister = ctx.createGain();
      meister.gain.value = 0.0;
      meister.connect(ctx.destination);
    }

    // Rauschpuffer, einmal erzeugt
    let rauschPuffer = null;
    function rauschen() {
      if (rauschPuffer) return rauschPuffer;
      const n = ctx.sampleRate * 2;
      rauschPuffer = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = rauschPuffer.getChannelData(0);
      let letzt = 0;
      for (let i = 0; i < n; i++) {           // braunes Rauschen
        const w = Math.random() * 2 - 1;
        letzt = (letzt + 0.02 * w) / 1.02;
        d[i] = letzt * 3.2;
      }
      return rauschPuffer;
    }

    // Aufgenommene Klänge (ElevenLabs), einmal dekodiert
    const puffer = {};
    async function ladePuffer(name) {
      if (puffer[name]) return puffer[name];
      const r = await fetch(TOENE[name]);
      const ab = await r.arrayBuffer();
      puffer[name] = await ctx.decodeAudioData(ab);
      return puffer[name];
    }
    function spiele(name, laut, loopen) {
      if (!ctx || !an || !puffer[name]) return null;
      const q = ctx.createBufferSource();
      q.buffer = puffer[name]; q.loop = !!loopen;
      const g = ctx.createGain(); g.gain.value = laut;
      q.connect(g).connect(meister); q.start();
      return { q, g };
    }

    function bettAn() {
      if (!ctx || bett) return;
      bett = ctx.createGain();
      bett.gain.value = 0.9;
      bett.connect(meister);

      // Der aufgenommene Raumton des Brauhauses, endlos
      ladePuffer("ambient").then(buf => {
        if (!bett) return;
        const q = ctx.createBufferSource();
        q.buffer = buf; q.loop = true;
        q.loopStart = 0.6; q.loopEnd = Math.max(1, buf.duration - 0.6);
        const g = ctx.createGain(); g.gain.value = 0.85;
        q.connect(g).connect(bett); q.start();
      }).catch(() => {});
      ladePuffer("wagen").catch(() => {});
      ladePuffer("fass").catch(() => {});
      ladePuffer("blatt").catch(() => {});

      // Kirchturm, sehr selten
      (function glocke() {
        if (!bett || !ctx) return;
        setTimeout(() => { if (bett) { ton(392, 2.6, 0.045, "sine"); glocke(); } },
          26000 + Math.random() * 40000);
      })();
    }

    function ton(f, dauer, laut, art, ziel) {
      if (!ctx || !an) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = art || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(laut, ctx.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dauer);
      o.connect(g).connect(ziel || meister);
      o.start(); o.stop(ctx.currentTime + dauer + 0.05);
      return o;
    }
    function klick(f, dauer, laut) {
      if (!ctx || !an) return;
      const q = ctx.createBufferSource(); q.buffer = rauschen();
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = 2.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(laut, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dauer);
      q.connect(bp).connect(g).connect(meister);
      q.start(); q.stop(ctx.currentTime + dauer + 0.02);
    }

    let fahrGeraeusch = null;
    return {
      umschalten() {

        an = !an;
        if (an) {
          if (ctx.state === "suspended") ctx.resume();

        } else if (meister) {
          meister.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 0.3);
        }
        return an;
      },
      erstStart() { start(); if (ctx && ctx.state === "suspended") ctx.resume(); },
      istAn() { return an; },
      // Ereignisse

      fassAb()   { if (!spiele("fass", 0.55)) { klick(150, 0.14, 0.36); ton(110, 0.12, 0.10, "triangle"); } },
      fehl()     { ton(150, 0.16, 0.10, "sawtooth"); },
      knopf()    { klick(700, 0.05, 0.16); },
      blatt()    { if (!spiele("blatt", 0.6)) { klick(2600, 0.20, 0.10); klick(1700, 0.30, 0.07); } },
      muenze()   { ton(1180, 0.14, 0.07, "triangle"); ton(1560, 0.20, 0.05, "sine"); },
      schwer()   { ton(74, 0.9, 0.16, "sine"); },
      hell()     { ton(660, 0.5, 0.07, "sine"); ton(990, 0.7, 0.04, "sine"); },

          const g = ctx.createGain(); g.gain.value = 0;

        }
        const g = ctx.createGain(); g.gain.value = 0; g.connect(meister);

        lp.type = "lowpass"; lp.frequency.value = 340;

        const takt = setInterval(() => klick(220, 0.05, 0.13), 300);
        fahrGeraeusch = { g, q, takt };
      },

  function strassenhaeuser() {

  /* ==================================================================
     7 — BEDIENUNG: ziehen und klicken
     ================================================================== */
  let zieht = null;

  function svgPunkt(ev) {
    const r = svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width * 1600,
             y: (ev.clientY - r.top) / r.height * 900 };
  }

  function greifbarMachen(g, fassId) {
    g.addEventListener("pointerdown", ev => {
      if (Z.phase !== "plan") return;
      if (geladen() >= WAGEN_PLAETZE) { Ton.fehl(); hinweis("Der Wagen ist voll."); return; }
      ev.preventDefault();
      const f = fassById(fassId); if (!f) return;
      Ton.fassAuf();
      zieht = { fassId, zeiger: ev.pointerId, startX: ev.clientX, startY: ev.clientY,
                bewegt: false };
      const p = svgPunkt(ev);
      const geist = G(svg, { id:"zugFass", filter:"url(#heben)", "pointer-events":"none" });
      fass(geist, -14, -18, 28, 36, sorteVon(f).id === "maerz", sorteVon(f).kurz);
      geist.setAttribute("transform", `translate(${p.x} ${p.y}) scale(1.25)`);
      zielemarkieren(f.sorte, true);
      svg.setPointerCapture(ev.pointerId);
    });
    // Tastatur: gleichwertig zum Anwählen
    g.addEventListener("keydown", ev => {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      ev.preventDefault();
      if (Z.phase !== "plan") return;
      if (Z.gewaehlt !== fassId && geladen() >= WAGEN_PLAETZE) {
        Ton.fehl(); hinweis("Der Wagen ist voll."); return;
      }
      Z.gewaehlt = (Z.gewaehlt === fassId) ? null : fassId;
      Ton.fassAuf(); zeichneBuehne();
      if (Z.gewaehlt) hinweis("Jetzt ein Haus anklicken.");
    });
  }

  function zielemarkieren(sorteId, an) {
    Z.haeuser.forEach(h => {
      const grp = svg.querySelector(`g[data-haus="${h.id}"]`);
      if (!grp) return;
      let m = grp.querySelector(".marke");
      if (m) m.remove();
      if (!an || !h.unser) return;
      const passt = erreichbar(h, sorteId);
      const voll = (h.bekommen + (Z.ladung[h.id]||[]).length) >= h.will;
      const m2 = e("rect", { class:"marke", x:h.x-60, y:ERDE-100, width:120, height:170,
        fill: passt && !voll ? "#c0442a14" : "none",
        stroke: passt ? (voll ? C.grauD : C.rot) : C.grauD,
        "stroke-width": passt && !voll ? 2.4 : 1.4,
        "stroke-dasharray": passt && !voll ? null : "5 4", "pointer-events":"none" });

      if (!passt) {
        const t = e("text", { class:"marke", x:h.x, y:ERDE-112, "text-anchor":"middle",

        grp.appendChild(t);
      }
    });
  }

  svg.addEventListener("pointermove", ev => {
    if (!zieht) return;
    if (Math.abs(ev.clientX - zieht.startX) > 6 || Math.abs(ev.clientY - zieht.startY) > 6)
      zieht.bewegt = true;
    const g = document.getElementById("zugFass"); if (!g) return;
    const p = svgPunkt(ev);
    g.setAttribute("transform", `translate(${p.x} ${p.y}) scale(1.25)`);
  });

  svg.addEventListener("pointerup", ev => {
    if (!zieht) return;
    const p = svgPunkt(ev);
    const fid = zieht.fassId, bewegt = zieht.bewegt;
    zieht = null;
    const g = document.getElementById("zugFass"); if (g) g.remove();
    zielemarkieren(null, false);
    const treffer = Z.haeuser.find(h => h.unser &&
      Math.abs(p.x - h.x) < 66 && p.y > ERDE - 110 && p.y < ERDE + 100);
    if (treffer) { beladen(fid, treffer); return; }
    // Kaum bewegt? Dann war es kein Ziehen, sondern ein Anwählen.
    if (!bewegt) {
      Z.gewaehlt = (Z.gewaehlt === fid) ? null : fid;
      zeichneBuehne();
      if (Z.gewaehlt) hinweis("Jetzt ein Haus anklicken.");
      return;
    }

  });

  function abwurfMachen(grp, h) {
    grp.style.cursor = "pointer";
    grp.addEventListener("click", () => {
      if (Z.phase !== "plan") return;
      if (Z.gewaehlt) { beladen(Z.gewaehlt, h); Z.gewaehlt = null; return; }
      // ohne Fass: Zettel des Wirtes zeigen
      if (h.unser || h.adler) { Ton.blatt(); Z.zettelOffen = h.id; zeichneBuehne(); }
    });
  }

  function beladen(fassId, h) {
    const f = fassById(fassId);
    if (!f) { zeichneBuehne(); return; }
    if (!h.unser) { Ton.fehl(); hinweis(`${h.name} zapft nicht unser Bier.`); zeichneBuehne(); return; }
    if (!erreichbar(h, f.sorte)) {
      Ton.fehl();
      hinweis(`${sorteVon(f).name} hält ${sorteVon(f).haelt} — ${h.ort} liegt ${h.km} km weit. Zu weit.`);
      zeichneBuehne(); return;
    }
    if (geladen() >= WAGEN_PLAETZE) { Ton.fehl(); hinweis("Der Wagen ist voll."); zeichneBuehne(); return; }
    const drin = (Z.ladung[h.id] || []).length;
    if (h.bekommen + drin >= h.will) {
      Ton.fehl(); hinweis(`Der ${h.name} braucht diese Woche nicht mehr.`); zeichneBuehne(); return;
    }
    Z.keller = Z.keller.filter(x => x.id !== fassId);
    (Z.ladung[h.id] = Z.ladung[h.id] || []).push(fassId);
    Z.fassLager[fassId] = f;
    Ton.fassAb();
    zeichneBuehne();
    if (Z.ersteFuhre && geladen() === 1)
      hinweis("Gut. Lade so viel du willst — dann schick den Wagen los.");
  }

  /* ==================================================================
     8 — DIE FAHRT
     ================================================================== */
  function abschicken() {
    if (Z.phase !== "plan" || !geladen()) return;
    Z.phase = "fahrt";
    Z.gewaehlt = null; Z.zettelOffen = null;
    zeichneBuehne();
    // Knopf und Hinweise weg
    svg.querySelectorAll(".knopf").forEach(n => n.remove());

    const stationen = Object.keys(Z.ladung)
      .map(id => Z.haeuser.find(h => h.id === id))
      .sort((a, b) => a.x - b.x);

    const wagen = document.getElementById("wagen");
    const ladung = document.getElementById("ladungG");
    Ton.fahrtAn();

    let idx = 0;
    const startX = HOF_X;
    function zurStation() {
      if (idx >= stationen.length) { heimfahrt(); return; }
      const h = stationen[idx];
      fahre(wagen, ladung, aktX(), h.x - 96, 1, () => {
        // abliefern
        const n = Z.ladung[h.id].length;
        h.bekommen += n;
        Z.hlGesamt += n;
        Z.wocheGeliefert = (Z.wocheGeliefert || 0) + n;
        Z.kasse += n * PREIS_HL * 4;
        Ton.fassAb(); Ton.muenze();
        // Fässer vom Wagen entfernen
        const kinder = Array.from(ladung.children);
        for (let k = 0; k < n && kinder.length; k++) {
          const c = kinder.shift(); if (c) c.remove();
        }
        delete Z.ladung[h.id];
        // Fass fliegt ins Haus
        blitz(h.x, ERDE + 76, `+${n}`);
        idx++;
        setTimeout(zurStation, 420);
      });
    }
    function aktX() {
      const t = wagen.getAttribute("transform") || "";
      const m = t.match(/translate\(([-\d.]+)/);
      return m ? parseFloat(m[1]) : startX;
    }
    function heimfahrt() {
      fahre(wagen, ladung, aktX(), startX, -1, () => {
        Ton.fahrtAus();
        wocheAbschliessen();
      });
    }
    zurStation();
  }

  function fahre(wagen, ladung, von, bis, richtung, fertig) {
    const dauer = Math.max(420, Math.abs(bis - von) * 2.1);
    const t0 = performance.now();
    const raeder = wagen.querySelectorAll(".rad");
    function schritt(t) {
      const p = Math.min(1, (t - t0) / dauer);
      const ease = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
      const x = von + (bis - von) * ease;
      wagen.setAttribute("transform",
        `translate(${x} ${ERDE})` + (richtung < 0 ? "" : ""));
      if (ladung) ladung.setAttribute("transform", `translate(${x - HOF_X} 0)`);
      raeder.forEach((r, i) => {
        const cx = i ? 28 : -28;
        r.setAttribute("transform", `rotate(${(x - von) * 3.4} ${cx} -9)`);
      });
      if (p < 1) requestAnimationFrame(schritt); else fertig();
    }
    requestAnimationFrame(schritt);
  }

  function blitz(x, y, text) {
    const g = G(svg, { "pointer-events":"none" });
    const t = A(g, "text", { x, y, class:"nb", "text-anchor":"middle", fill:C.rot }, text);
    A(t, "animate", { attributeName:"y", from:y, to:y-46, dur:"0.9s", fill:"freeze" });
    A(t, "animate", { attributeName:"opacity", from:1, to:0, dur:"0.9s", fill:"freeze" });
    setTimeout(() => g.remove(), 950);
  }

  /* ==================================================================
     9 — WOCHENABSCHLUSS
     ================================================================== */
  function wocheAbschliessen() {
    // Wer hat diese Woche bekommen, was er wollte? Das ist das Protokoll.
    Z.haeuser.forEach(h => {
      const sp = (Z.protokoll[h.id] = Z.protokoll[h.id] || []);
      sp.push(!h.unser ? -1 : (h.bekommen >= h.will ? 1 : 0));
    });

    // Folgen je Haus
    let verloren = null, neuUmworben = null;
    unsere().forEach(h => {
      if (h.bekommen >= h.will) h.durst = Math.max(0, h.durst - 1);
      else h.durst += 1;
      if (h.durst >= 3 && !h.umworben) { h.umworben = true; neuUmworben = h; }
      if (h.durst < 3) h.umworben = false;
      if (h.durst >= 5) { h.unser = false; h.adler = true; h.umworben = false; verloren = h; }
      h.bekommen = 0;
    });
    Z.ladung = {}; Z.fassLager = {};

    Z.verlauf.push({ woche: Z.woche, kasse: Z.kasse,
                     geliefert: Z.wocheGeliefert || 0,
                     verlangt: unsere().reduce((a, h) => a + h.will, 0) });
    Z.wocheGeliefert = 0;

    if (verloren) {
      Ton.schwer();
      zeigeMeldung(`Der ${verloren.name} zu ${verloren.ort} zapft ab sofort Adlerbier.`,
        "Fünf Wochen zu wenig. Es stand jede Woche auf dem Blatt.", true);
      setTimeout(naechsteWoche, 2600);
      return;
    }
    if (neuUmworben) {
      Ton.schwer();
      Z.zettelOffen = neuUmworben.id;
      zeigeMeldung(`Der Adler hängt sein Schild an den ${neuUmworben.name}.`,
        "Noch zwei Wochen ohne Lieferung, dann ist das Haus weg.", true);
      setTimeout(naechsteWoche, 2400);
      return;
    }
    naechsteWoche();
  }

  function naechsteWoche() {
    Z.woche++;
    if (Z.woche > WOCHEN) { szeneWechsel(zeigeMichaeli); return; }
    Z.phase = "plan";
    const sauer = brauen();
    zeichneBuehne();
    if (sauer.length) {
      Ton.fehl();
      hinweis(`${sauer.length} Fass ist im Keller sauer geworden — zu lange gelegen.`);
    }
    if (Z.ersteFuhre) { Z.ersteFuhre = false; }
  }

  function starteJahr() {
    Z.phase = "plan";
    for (let i = 0; i < 2; i++) brauen();   // Anfangsvorrat
    zeichneBuehne();
    setTimeout(() => hinweis("Zieh ein Fass aus dem Keller auf ein Wirtshaus."), 500);
    setTimeout(() => {
      if (!geladen()) hinweis("Der Ochsen will zwei, die Krone eines, der Löwen eines. Du hast drei Plätze.");
    }, 6500);
  }

  /* ==================================================================
     10 — MELDUNGEN UND ZETTEL
     ================================================================== */
  const hinweisEl = document.getElementById("hinweis");
  let hinweisTimer = null;
  function hinweis(text) {
    hinweisEl.textContent = text;
    hinweisEl.classList.add("an");
    clearTimeout(hinweisTimer);
    hinweisTimer = setTimeout(() => hinweisEl.classList.remove("an"), 4200);
  }

  function zeigeMeldung(zeile1, zeile2, ernst) {
    const g = G(svg, { "pointer-events":"none" });
    A(g, "rect", { x:0, y:340, width:1600, height:150, fill:"#16150fE8" });
    A(g, "text", { x:800, y:400, class:"lb", "text-anchor":"middle",
      style:"fill:" + (ernst ? "#e0705a" : "#efe9dc"), "font-size":26 }, zeile1);
    A(g, "text", { x:800, y:436, class:"l", "text-anchor":"middle",
      style:"fill:#a99d88" }, zeile2);
    A(g, "animate", { attributeName:"opacity", values:"0;1;1;0", dur:"2.4s", fill:"freeze" });
    setTimeout(() => g.remove(), 2500);
  }

  function zeichneZettel(hausId) {
    const h = Z.haeuser.find(x => x.id === hausId); if (!h) return;
    const g = G(svg, { transform:"rotate(-3 1230 210)", filter:"url(#schatten)" });
    A(g, "rect", { x:1000, y:120, width:460, height:150, fill:"#f4f0e6",
      stroke:C.tinte, "stroke-width":1 });
    A(g, "circle", { cx:1432, cy:136, r:8, fill:C.grau, stroke:C.tinte, "stroke-width":1.4 });
    h.zettel.forEach((t, i) =>
      A(g, "text", { x:1024, y:170 + i*30, class:"hand" }, t));
    A(g, "text", { x:1436, y:248, class:"hand", "text-anchor":"end", "font-size":16 },
      `${h.wirt}, ${h.name}`);
    const zu = A(svg, "g", { class:"ziel", tabindex:0, role:"button", "aria-label":"Zettel schließen" });
    A(zu, "rect", { x:1000, y:120, width:460, height:150, fill:"transparent" });
    zu.addEventListener("click", () => { Z.zettelOffen = null; Ton.blatt(); zeichneBuehne(); });
  }

  /* ==================================================================
     11 — MICHAELI
     ================================================================== */
  let michaeliWahl = [];

  function zeigeMichaeli() {
    Z.phase = "michaeli";
    michaeliWahl = [];
    zeichneMichaeli();
  }

  function angebote() {
    const a = [];
    if (!Z.keller_tief) a.push({ id:"keller", kopf:"Den Felsenkeller vertiefen", preis:6000,
      zeilen:["Der Keller hält doppelt so lange kühl — dein Bier wird Exportbier",
              "Reichweite 32 auf 65 km · Altenau wird erreichbar"] });
    const krone = Z.haeuser.find(h => h.id === "krone");
    if (krone.unser) a.push({ id:"dach", kopf:"Das Dach der Krone decken", preis:2500,
      zeilen:["Michael Berger bekommt sein Dach — und wir den Hahn auf fünf Jahre",
              "Der Adler kann die Krone solange nicht nehmen"] });
    a.push({ id:"pfanne", kopf:"Eine zweite Sudpfanne", preis:4000,
      zeilen:["Vier Fass in der Woche statt drei",
              "Der Wagen fasst dann auch eines mehr"] });
    a.push({ id:"nichts", kopf:"Nichts tun", preis:0,
      zeilen:["Das Geld bleibt liegen und der Winter wird lang", ""] });
    return a;
  }

  function zeichneMichaeli() {
    leeren(svg); defs(); papier(svg);
    A(svg, "text", { x:64, y:104, class:"titel", "font-size":46 }, "MICHAELI 1884");
    A(svg, "text", { x:64, y:138, class:"l", style:"fill:#55514a" },
      "Das Braujahr ist um. Was es gebracht hat — und was zu entscheiden ist.");

    // Bericht links
    const x = 64, w = 700;
    A(svg, "text", { x, y:206, class:"h" }, "DAS JAHR");
    const halten = unsere().length, weg = Z.haeuser.filter(h => h.adler).length;
    const zeilenD = [
      ["Fässer ausgefahren", String(Z.hlGesamt)],
      ["Häuser gehalten", `${halten} von 3`],
      ["Beim Adler", String(weg)],
      ["Kasse", Z.kasse.toLocaleString("de-DE").replace(/\./g," ") + " M"]
    ];
    A(svg, "rect", { x, y:222, width:w, height:6 + zeilenD.length*38, fill:"none",
      stroke:C.tinte, "stroke-width":1.6 });
    zeilenD.forEach((z, i) => {
      const yy = 228 + i*38;
      if (i) A(svg, "line", { x1:x, y1:yy, x2:x+w, y2:yy, stroke:C.tinte, "stroke-width":.8 });
      A(svg, "text", { x:x+16, y:yy+26, class:"l" }, z[0]);
      A(svg, "text", { x:x+w-16, y:yy+26, class:"nb", "text-anchor":"end" }, z[1]);
    });

    // Urteil
    const urteil = weg === 0
      ? ["Kein Haus verloren.", "Das ist mehr, als die meisten im ersten Jahr schaffen."]
      : weg === 1
        ? ["Ein Haus ist weg.", "Es hing drei Wochen ein graues Schild daran, bevor es fiel."]
        : ["Zwei Häuser sind weg.", "Der Adler hat mehr Schilder in Hohenau als du."];
    A(svg, "text", { x, y:446, class:"h" }, "URTEIL");
    zeilen(svg, x, 478, urteil, "lb", 30);
    svg.querySelectorAll("text.lb").forEach(t => { if (+t.getAttribute("y") >= 478) t.setAttribute("font-size", "21"); });

    // Wen hast du wann hängen lassen — das Protokoll des Jahres
    A(svg, "text", { x, y:584, class:"h" }, "WEN DU WANN HAST WARTEN LASSEN");
    const wochen = Math.max(1, (Z.protokoll.krone || []).length);
    const zw = 26, zx = x + 150, kw = Math.min(30, (w - 190) / wochen);
    HAEUSER.forEach((hd, r) => {
      const yy = 612 + r * zw;
      const h = Z.haeuser.find(v => v.id === hd.id);
      if (hd.id === "sonne") return;
      A(svg, "text", { x, y:yy + 13, class:"l" }, hd.name);
      (Z.protokoll[hd.id] || []).forEach((v, i) => {
        const bx = zx + i * kw;
        if (v === 1) A(svg, "rect", { x:bx, y:yy, width:kw-4, height:17, fill:C.grau,
          stroke:C.tinte, "stroke-width":.9 });
        else if (v === 0) A(svg, "rect", { x:bx, y:yy, width:kw-4, height:17, fill:"none",
          stroke:C.rot, "stroke-width":1.6 });
        else A(svg, "line", { x1:bx, y1:yy+8, x2:bx+kw-4, y2:yy+8,
          stroke:C.geist, "stroke-width":1.6 });
      });
      const kurz = (Z.protokoll[hd.id] || []).filter(v => v === 0).length;
      A(svg, "text", { x:x + w - 10, y:yy + 13, class:"s", "text-anchor":"end",
        style:"fill:" + (kurz ? C.rot : C.text2) },
        h && !h.unser ? "verloren" : (kurz ? kurz + "× zu wenig" : "immer beliefert"));
    });
    A(svg, "text", { x, y:612 + 3 * zw + 20, class:"s" },
      "gefüllt = bekommen was er wollte · rot = zu wenig · Strich = nicht mehr unser");

    // Was die Vollversion daraus macht
    A(svg, "text", { x, y:748, class:"h" }, "WAS DIE VOLLVERSION DARAUS MACHT");
    zeilen(svg, x, 780,
      ["Dieses Jahr ist eines von rund fünfundzwanzig. Zwischen ihnen liegt der Erbfall,",
       "und was hier eine Straße ist, wird eine Gabelung aus Straße und Eisenbahn."],
      "l", 26);

    // Angebote rechts
    const ax = 820, aw = 716;
    A(svg, "text", { x:ax, y:206, class:"h" }, "WAS ZU ENTSCHEIDEN IST");
    let ay = 222;
    const rest = Z.kasse - michaeliWahl.reduce((s,id) =>
      s + (angebote().find(a => a.id === id)?.preis || 0), 0);
    angebote().forEach(a => {
      const hh = 92;
      const ist = michaeliWahl.includes(a.id);
      const teuer = !ist && a.preis > rest;
      const g = A(svg, "g", { class: teuer ? "" : "ziel", tabindex: teuer ? -1 : 0,
        role:"button", "aria-label":`${a.kopf}, ${a.preis} Mark` });
      A(g, "rect", { x:ax, y:ay, width:aw, height:hh,
        fill: ist ? "#c0442a12" : "transparent",
        stroke: teuer ? C.geist : C.tinte, "stroke-width": 1.5 });
      if (ist) A(g, "rect", { x:ax+4, y:ay+4, width:aw-8, height:hh-8, fill:"none",
        stroke:C.rot, "stroke-width":3 });
      A(g, "rect", { class:"fokus", x:ax+7, y:ay+7, width:aw-14, height:hh-14,
        fill:"none", stroke:"none" });
      A(g, "text", { x:ax+18, y:ay+32, class:"lb",
        style:"fill:" + (teuer ? C.grauD : C.tinte) }, a.kopf);
      A(g, "text", { x:ax+aw-18, y:ay+32, class:"nb", "text-anchor":"end",
        style:"fill:" + (teuer ? C.grauD : C.tinte) },
        a.preis ? a.preis.toLocaleString("de-DE").replace(/\./g," ") + " M" : "—");
      a.zeilen.forEach((t, i) => t && A(g, "text", { x:ax+18, y:ay+56+i*22, class:"s",
        style:"fill:" + (teuer ? C.grauD : C.text2) }, t));
      if (!teuer) {
        const w2 = () => {
          Ton.knopf();
          if (a.id === "nichts") michaeliWahl = ["nichts"];
          else {
            michaeliWahl = michaeliWahl.filter(x => x !== "nichts");
            michaeliWahl = ist ? michaeliWahl.filter(x => x !== a.id) : michaeliWahl.concat(a.id);
          }
          zeichneMichaeli();
        };
        g.addEventListener("click", w2);
        g.addEventListener("keydown", ev => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); w2(); }
        });
      }
      ay += hh + 12;
    });

    A(svg, "text", { x:ax, y:ay+26, class:"l" }, "Bleiben");
    A(svg, "text", { x:ax+aw, y:ay+26, class:"nb", "text-anchor":"end" },
      rest.toLocaleString("de-DE").replace(/\./g," ") + " M");

    knopf(svg, ax, 826, aw, 52, "UND WEITER? →", "Weiter zum Ausblick", () => {
      michaeliWahl.forEach(id => {
        const a = angebote().find(x => x.id === id);
        if (a) Z.kasse -= a.preis;
        if (id === "keller") Z.keller_tief = true;
      });
      szeneWechsel(zeigeAusblick);
    }, michaeliWahl.length === 0);
    Ton.blatt();
  }

  /* ==================================================================
     12 — AUSBLICK: was die Vollversion wäre
     ================================================================== */
  const EPOCHEN = [
    { jahr:"1350", bild:"ep1350", titel:"DAS RECHT", verb:"überleben",
      text:"Ein Kessel, den dir der Rat leiht. Bier hält zehn Tage, alles ist die eigene Gasse. "
         + "Das bessere Bier — gehopft — ist verboten, weil die Stadt an der Grut verdient.",
      bindung:"Gebunden wird mit Recht und Gunst.", farbe:"#6a5a3e" },
    { jahr:"1884", bild:"ep1884", titel:"DIE MASCHINE", verb:"skalieren",
      text:"Was du gerade gespielt hast. Dampf, Eisenbahn, Eismaschine — und der "
         + "Bierlieferungsvertrag, mit dem man einen Wirt kauft statt ihn zu überreden.",
      bindung:"Gebunden wird mit Vorschuss und Vertrag.", farbe:"#c0442a" },
    { jahr:"1968", bild:"ep1968", titel:"DIE VERDRÄNGUNG", verb:"zusammenlegen",
      text:"Die roten Linien fallen. Bier hält jetzt überall. Von neunundvierzig Häusern "
         + "bleiben sieben, und der Rest hängt am Zapfhahn eines Konzerns.",
      bindung:"Gebunden wird mit dem Objektvertrag.", farbe:"#4a5a6a" },
    { jahr:"2024", bild:"ep2024", titel:"DIE BEDEUTUNG", verb:"bedeuten",
      text:"Eine einzige Unterschrift entscheidet über zwei Drittel deines Absatzes. "
         + "Die Frage ist nicht mehr, ob es reicht — sondern ob dich jemand vermissen würde.",
      bindung:"Gebunden wird mit der Listung.", farbe:"#3f4a3f" }
  ];

  function zeigeAusblick() {
    Z.phase = "ausblick";
    leeren(svg); defs();
    A(svg, "rect", { width:1600, height:900, fill:"#14120f", "pointer-events":"none" });
    A(svg, "text", { x:800, y:98, class:"titel", "font-size":40, "text-anchor":"middle",
      style:"fill:#efe9dc" }, "SIEBENHUNDERT JAHRE");
    A(svg, "text", { x:800, y:134, class:"l", "text-anchor":"middle", style:"fill:#8d8272" },
      "Dieselbe Frage, vier Mal anders gestellt: wessen Bier fließt in einem fremden Haus.");

    const bw = 356, gap = 20, x0 = (1600 - (4*bw + 3*gap)) / 2;
    EPOCHEN.forEach((ep, i) => {
      const x = x0 + i*(bw+gap), y = 190, h = 470;
      const g = G(svg);
      A(g, "rect", { x, y, width:bw, height:h, fill:"#1b1813",
        stroke: i === 1 ? ep.farbe : "#312c24", "stroke-width": i === 1 ? 2.5 : 1.4 });
      // Vignette in der Drucktechnik ihrer Zeit
      const bh2 = 168, bx2 = x + 22, by2 = y + 104;
      A(g, "image", { href: BILDER[ep.bild], x:bx2, y:by2, width:bw-44, height:bh2,
        preserveAspectRatio:"xMidYMid slice", opacity:.9 });
      A(g, "rect", { x:bx2, y:by2, width:bw-44, height:bh2, fill:"none",
        stroke:"#312c24", "stroke-width":1 });
      A(g, "text", { x:x+22, y:y+44, class:"titel", "font-size":30, style:"fill:" + ep.farbe },
        ep.jahr);
      A(g, "text", { x:x+22, y:y+70, class:"h", style:"fill:#cdc5b6" }, ep.titel);
      A(g, "text", { x:x+22, y:y+92, class:"s", style:"fill:#6f6657" }, "Kernverb: " + ep.verb);
      const worte = ep.text.split(" ");
      const zl = []; let z = "";
      worte.forEach(wd => {
        if ((z + " " + wd).length > 42) { zl.push(z); z = wd; } else z = z ? z + " " + wd : wd;
      });
      zl.push(z);
      zl.forEach((t, k) => A(g, "text", { x:x+22, y:y+300+k*23, "font-size":14.5,
        style:"fill:#8d8272" }, t));
      A(g, "line", { x1:x+22, y1:y+h-58, x2:x+bw-22, y2:y+h-58, stroke:"#312c24", "stroke-width":1 });
      A(g, "text", { x:x+22, y:y+h-32, "font-size":14, style:"fill:" + ep.farbe }, ep.bindung);
      if (i === 1) A(g, "text", { x:x+bw-22, y:y+42, class:"hs", "text-anchor":"end",
        style:"fill:" + ep.farbe }, "GERADE GESPIELT");
      // Einblenden
      A(g, "animate", { attributeName:"opacity", from:0, to:1, dur:"0.5s",
        begin:`${i*0.28}s`, fill:"freeze" });
      g.setAttribute("opacity", "0");
    });

    zeilen(svg, 800, 716,
      ["Was in der Vollversion dazukommt: der Erbfall — Verträge hängen an Personen, und wenn",
       "ein Wirt stirbt, wird alles neu verhandelt. Die Gabelung von Straße und Eisenbahn.",
       "Die Abgabe auf die Stammwürze. Und Konkurrenzhäuser, die selbst erben und untergehen."],
      "l", 26, "middle");
    svg.querySelectorAll("text.l").forEach(t => {
      if (+t.getAttribute("y") >= 700) t.setAttribute("style", "fill:#6f6657");
    });

    knopf(svg, 560, 800, 220, 48, "NOCH EINMAL", "Noch einmal spielen", () => {
      Object.assign(Z, {
        phase:"plan", woche:1, kasse:4000, anschlag:0, keller:[], ladung:{}, fassLager:{},
        haeuser: frischeHaeuser(), protokoll:{},
        zettelOffen:null, gewaehlt:null, verlauf:[], keller_tief:false, fassNr:0,
        ersteFuhre:true, hlGesamt:0
      });
      szeneWechsel(starteJahr);
    });
    knopf(svg, 820, 800, 220, 48, "ZUM TITEL", "Zurück zum Titelbild",
      () => szeneWechsel(zeigeTitel));
    Ton.hell();
  }

  function epochenBild(g, i, farbe) {
    const st = { fill:"none", stroke:farbe, "stroke-width":2, opacity:.85 };
    if (i === 0) {            // Kessel über Feuer
      A(g, "path", Object.assign({ d:"M -34 -16 Q 0 26 34 -16" }, st));
      A(g, "line", Object.assign({ x1:-42, y1:-16, x2:42, y2:-16 }, st));
      A(g, "path", Object.assign({ d:"M -16 30 l 6 -12 l 6 10 l 7 -15 l 7 17" }, st));
      A(g, "line", Object.assign({ x1:-46, y1:46, x2:46, y2:46 }, st));
    } else if (i === 1) {     // Wagen
      A(g, "rect", Object.assign({ x:-40, y:-18, width:80, height:16 }, st));
      A(g, "circle", Object.assign({ cx:-24, cy:14, r:11 }, st));
      A(g, "circle", Object.assign({ cx:24, cy:14, r:11 }, st));
      A(g, "line", Object.assign({ x1:-52, y1:28, x2:52, y2:28 }, st));
      A(g, "path", Object.assign({ d:"M 40 -10 l 22 4" }, st));
    } else if (i === 2) {     // Tanks
      [-30, 0, 30].forEach(dx => {
        A(g, "rect", Object.assign({ x:dx-11, y:-26, width:22, height:48, rx:3 }, st));
      });
      A(g, "line", Object.assign({ x1:-50, y1:28, x2:50, y2:28 }, st));
    } else {                  // Regal mit einer Flasche
      A(g, "line", Object.assign({ x1:-52, y1:-24, x2:52, y2:-24 }, st));
      A(g, "line", Object.assign({ x1:-52, y1:20, x2:52, y2:20 }, st));
      for (let k = 0; k < 7; k++) {
        const bx = -44 + k*15;
        A(g, "path", Object.assign({ d:`M ${bx} 18 v -22 l 3 -6 v -6 h 3 v 6 l 3 6 v 22 z`,
          opacity: k === 3 ? 1 : .3 }, st));
      }
      A(g, "line", Object.assign({ x1:-52, y1:44, x2:52, y2:44 }, st));
    }
  }

  /* ==================================================================
     13 — RAHMEN
     ================================================================== */
  const vorhang = document.getElementById("vorhang");
  function szeneWechsel(fn) {
    vorhang.classList.add("zu");
    setTimeout(() => { fn(); vorhang.classList.remove("zu"); }, 460);
  }

  const tonKnopf = document.getElementById("ton");
  function tonUmschalten() {
    const an = Ton.umschalten();
    tonKnopf.textContent = "TON: " + (an ? "AN" : "AUS");
  }
  tonKnopf.addEventListener("click", tonUmschalten);

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") {
      if (Z.zettelOffen) { Z.zettelOffen = null; zeichneBuehne(); }
    }
    if (ev.key === "m" || ev.key === "M") tonUmschalten();
  });

  window.addEventListener("resize", passeAn);
  function passeAn() {
    const b = document.getElementById("buehne");
    const s = Math.min(window.innerWidth / 1600, (window.innerHeight - 20) / 900);
    b.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  passeAn();

  zeigeTitel();
})();
</script>
